<!DOCTYPE html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Nimbus AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <img src="assets/logo/logo.svg" alt="Nimbus AI logo" class="brand-logo" />
          <h2>Nimbus AI</h2>
        </div>
        <h3>Farmer Login</h3>
        <form id="loginForm" class="auth-form">
          <label for="mobile">Mobile Number</label>
          <input id="mobile" name="mobile" type="tel" placeholder="9876543210" required />
          <p class="location-note"><i class="fa-solid fa-location-dot"></i> Allow location access after login for village-specific weather and advisories. Your exact location is used only on this device for personalization.</p>
          <button type="submit" class="btn btn-primary">Login</button>
          <p id="loginStatus" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
    <footer class="site-footer auth-footer">
      <strong>Nimbus AI</strong> created by BRB Technology · Copyright © 2026 BRB Technology. All rights reserved. · <a href="mailto:vijaycbade@gmail.com">vijaycbade@gmail.com</a>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
